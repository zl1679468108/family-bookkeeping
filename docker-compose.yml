services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: family-bookkeeping-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    ports:
      - "3000:3000"
    networks:
      - family-bookkeeping-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: family-bookkeeping-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - family-bookkeeping-network

networks:
  family-bookkeeping-network:
    driver: bridge
