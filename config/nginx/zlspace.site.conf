# zlspace.site — 多项目子路径部署
# - /bookkeeping/  静记 PC Web + API
# - /portfolio/    作品集官网（本仓库部署）
# 注意：静记 deploy-cvm.sh 若上传旧 conf 会覆盖本文件；已同步更新静记仓库 conf。

# ---- HTTP: 80 -> 301 HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name zlspace.site www.zlspace.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: 443 (域名, Let's Encrypt) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zlspace.site www.zlspace.site;

    ssl_certificate     /etc/letsencrypt/live/zlspace.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zlspace.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    # 根路径默认进作品集（个人官网入口）
    location = / {
        return 301 https://$host/portfolio/;
    }

    # ---- 作品集 /portfolio/ ----
    location = /portfolio {
        return 301 https://$host/portfolio/;
    }

    location /portfolio/ {
        # 文件在 /var/www/portfolio/ ，root + URI 映射可靠支持 SPA fallback
        root /var/www;
        index index.html;
        try_files $uri $uri/ /portfolio/index.html;
    }

    # ---- 静记 /bookkeeping/ ----
    location = /bookkeeping {
        return 301 https://$host/bookkeeping/;
    }

    location /bookkeeping/ {
        alias /var/www/family-bookkeeping/;
        index index.html;
        try_files $uri $uri/ /bookkeeping/index.html;
    }

    location /bookkeeping/api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /bookkeeping;
    }

    # 向后兼容：旧 /api 直连（小程序等）
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}

# ---- HTTPS: 443 (IP 直访, 自签 fallback) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 121.4.84.120;

    ssl_certificate     /etc/ssl/certs/zlspace_ip.crt;
    ssl_certificate_key /etc/ssl/private/zlspace_ip.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    location = / {
        return 301 https://$host/portfolio/;
    }

    location = /portfolio {
        return 301 https://$host/portfolio/;
    }

    location /portfolio/ {
        # 文件在 /var/www/portfolio/ ，root + URI 映射可靠支持 SPA fallback
        root /var/www;
        index index.html;
        try_files $uri $uri/ /portfolio/index.html;
    }

    location = /bookkeeping {
        return 301 https://$host/bookkeeping/;
    }

    location /bookkeeping/ {
        alias /var/www/family-bookkeeping/;
        index index.html;
        try_files $uri $uri/ /bookkeeping/index.html;
    }

    location /bookkeeping/api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /bookkeeping;
    }

    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
