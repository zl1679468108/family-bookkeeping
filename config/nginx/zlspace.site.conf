# 静记 - zlspace.site 子路径部署配置
# 本项目挂在 https://zlspace.site/bookkeeping/ ，接口 /bookkeeping/api
# 后续其他项目可各占独立子路径（如 /blog/、/other/），互不冲突。
# 注意：本文件由 scripts/deploy-cvm.sh 自动上传并 reload，手工修改会被覆盖。

# ---- HTTP: 80 -> 301 HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name zlspace.site www.zlspace.site;

    # Let's Encrypt DNS-01 不需要 webroot，但保留 /.well-known 以防未来切换验证方式
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: 443 (域名, Let's Encrypt) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zlspace.site www.zlspace.site;

    ssl_certificate     /etc/letsencrypt/live/zlspace.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zlspace.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    # 根路径 -> 记账应用，方便直接访问域名
    location = / {
        return 301 https://$host/bookkeeping/;
    }

    # 无斜杠的子路径 -> 补全斜杠（否则静态资源相对路径会错）
    location = /bookkeeping {
        return 301 https://$host/bookkeeping/;
    }

    # 记账应用前端（静态资源 + SPA fallback）
    # 用 alias 把 /bookkeeping/ 映射到实际部署目录 /var/www/family-bookkeeping/
    location /bookkeeping/ {
        alias /var/www/family-bookkeeping/;
        index index.html;
        try_files $uri $uri/ /bookkeeping/index.html;
    }

    # 记账应用后端 API：/bookkeeping/api/* -> 127.0.0.1:3000/api/*
    location /bookkeeping/api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /bookkeeping;
    }

    # 向后兼容：旧 /api 直连（Taro 小程序等仍可能使用）-> 127.0.0.1:3000
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 兜底：未知路径返回 404（未来项目自行声明子路径）
    location / {
        return 404;
    }
}

# ---- HTTPS: 443 (IP 直访, 自签证书 fallback) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 121.4.84.120;

    ssl_certificate     /etc/ssl/certs/zlspace_ip.crt;
    ssl_certificate_key /etc/ssl/private/zlspace_ip.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    location = / {
        return 301 https://$host/bookkeeping/;
    }

    location = /bookkeeping {
        return 301 https://$host/bookkeeping/;
    }

    location /bookkeeping/ {
        alias /var/www/family-bookkeeping/;
        index index.html;
        try_files $uri $uri/ /bookkeeping/index.html;
    }

    location /bookkeeping/api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /bookkeeping;
    }

    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
