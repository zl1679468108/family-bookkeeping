name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        project: [backend, frontend, taro]

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            taro/package-lock.json
            shared-types/package-lock.json

      - name: Install shared-types
        if: matrix.project != 'backend'
        working-directory: shared-types
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build backend
        if: matrix.project == 'backend'
        run: npm run build:prod

      - name: Build frontend
        if: matrix.project == 'frontend'
        run: npm run build:prod
        env:
          # 构建期占位，避免缺 env 导致失败
          VITE_API_BASE_URL: /api

      - name: Build taro weapp
        if: matrix.project == 'taro'
        run: npm run build:weapp
        env:
          TARO_APP_API_BASE_URL: https://zlspace.site/api
