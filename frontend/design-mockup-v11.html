<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>静记 · Design Mockup v11 — Sidebar优化</title>
  <style>
    /* ══════════════════════════════════════════
   静记 Design System v11 — 侧边栏折叠优化
   对齐 React Sidebar 组件实际实现
   Expanded: 240px / Collapsed: 64px
   ══════════════════════════════════════════ */
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap');

    :root {
      --bg: #F6F7F4;
      --srf: #FFF;
      --srfH: #F9FAF8;
      --fg: #1A1C19;
      --fg2: #5A5D58;
      --fg3: #8B8E89;
      --bd: #E0E2DD;
      --bdL: #EDEEE9;
      --pr: #2D9D8A;
      --prH: #248B78;
      --prBg: #E7F5F2;
      --prBd: #C4E5DE;
      --prGr: linear-gradient(135deg, #2D9D8A 0%, #45B7A7 100%);
      --inc: #3BA272;
      --incBg: #EAF7F0;
      --exp: #E06055;
      --expBg: #FCEEED;
      --warn: #E8A838;
      --warnBg: #FDF6E8;
      --info: #4A90D9;
      --infoBg: #ECF3FB;
      --ov: rgba(0, 0, 0, 0.35);
      --rs: 8px;
      --rm: 12px;
      --rl: 18px;
      --rx: 24px;
      --sh1: 0 1px 2px rgba(0, 0, 0, 0.04);
      --sh2: 0 2px 8px rgba(0, 0, 0, 0.06);
      --sh3: 0 8px 24px rgba(0, 0, 0, 0.08);
      --sh4: 0 16px 48px rgba(0, 0, 0, 0.12);
      --fn: 'DM Sans', -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      --fm: 'DM Mono', ui-monospace, monospace;
      --sw: 240px;
      --swc: 64px;
      --ease: cubic-bezier(0.25, 0, 0, 1);
      --sp: cubic-bezier(0.34, 1.56, 0.64, 1);
      --df: 0.15s;
      --dn: 0.25s;
      --ds: 0.35s
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased
    }

    body {
      font-family: var(--fn);
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
      overflow: hidden;
      height: 100vh
    }

    .app {
      display: flex;
      height: 100vh
    }

    /* ══════════════════════════════════════════
   SIDEBAR v11 — 折叠状态视觉优化
   对应: components/Sidebar/index.tsx + index.scss
   折叠宽度 64px，展开宽度 240px
   ══════════════════════════════════════════ */
    .sidebar {
      width: var(--sw);
      min-width: var(--sw);
      height: 100vh;
      background: var(--srf);
      border-right: 1px solid var(--bd);
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 100;
      transition: width var(--dn) var(--ease)
    }

    .sidebar.collapsed {
      width: var(--swc);
      min-width: var(--swc)
    }

    /* Logo 区域 — collapsed 时居中 */
    .sidebar-brand {
      padding: 18px 18px 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all var(--dn) var(--ease)
    }

    .sidebar.collapsed .sidebar-brand {
      padding: 16px 0 8px;
      justify-content: center
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      background: var(--prGr);
      border-radius: var(--rm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
      transition: all var(--dn) var(--ease)
    }

    .brand-text {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      transition: opacity var(--df), width var(--dn)
    }

    .sidebar.collapsed .brand-text {
      opacity: 0;
      width: 0;
      display: none
    }

    /* 折叠按钮 — 右侧边缘圆形按钮 */
    .sidebar-toggle {
      position: absolute;
      top: 66px;
      right: -12px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid var(--bd);
      background: var(--srf);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      color: var(--fg3);
      box-shadow: var(--sh1);
      transition: all var(--df)
    }

    .sidebar-toggle:hover {
      color: var(--pr);
      border-color: var(--pr)
    }

    .sidebar.collapsed .sidebar-toggle {
      top: 52px
    }

    /* Book Switcher — collapsed 时仅显示图标 */
    .book-area {
      padding: 0 12px 6px;
      position: relative;
      transition: all var(--dn)
    }

    .sidebar.collapsed .book-area {
      padding: 4px 0 8px;
      display: flex;
      justify-content: center
    }

    .book-trigger {
      padding: 7px 10px;
      background: var(--bg);
      border-radius: var(--rs);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all var(--df);
      white-space: nowrap
    }

    .book-trigger:hover {
      background: var(--srfA)
    }

    .sidebar.collapsed .book-trigger {
      justify-content: center;
      padding: 6px;
      width: 40px;
      height: 40px;
      border-radius: var(--rm);
      gap: 0
    }

    .book-avatar {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--prGr);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
      transition: all var(--dn)
    }

    .sidebar.collapsed .book-avatar {
      width: 24px;
      height: 24px;
      font-size: 12px
    }

    .book-name {
      font-size: 12px;
      font-weight: 600;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .sidebar.collapsed .book-name {
      display: none
    }

    .book-chevron {
      margin-left: auto;
      color: var(--fg3);
      font-size: 9px;
      transition: transform var(--df)
    }

    .sidebar.collapsed .book-chevron {
      display: none
    }

    .book-dropdown {
      position: absolute;
      left: 8px;
      top: 100%;
      width: 200px;
      background: var(--srf);
      border: 1px solid var(--bd);
      border-radius: var(--rm);
      box-shadow: var(--sh3);
      z-index: 200;
      display: none;
      overflow: hidden
    }

    .book-dropdown.active {
      display: block;
      animation: scaleIn 0.2s var(--sp)
    }

    .book-opt {
      padding: 9px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
      transition: background var(--df)
    }

    .book-opt:hover {
      background: var(--bg)
    }

    .book-opt .bdot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0
    }

    /* Nav — collapsed 时图标居中 */
    .nav-scroll {
      flex: 1;
      padding: 2px 6px;
      overflow-y: auto;
      overflow-x: hidden
    }

    .sidebar.collapsed .nav-scroll {
      padding: 2px 0
    }

    .nav-section {
      margin-bottom: 4px
    }

    .nav-sep {
      padding: 0 10px;
      margin: 10px 0 2px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--fg3);
      transition: all var(--df)
    }

    .sidebar.collapsed .nav-sep {
      opacity: 0;
      height: 0;
      margin: 0;
      overflow: hidden
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      margin: 1px 0;
      border-radius: var(--rs);
      font-size: 13px;
      font-weight: 500;
      color: var(--fg2);
      cursor: pointer;
      transition: all var(--df);
      white-space: nowrap;
      position: relative
    }

    .nav-item:hover {
      background: var(--bg);
      color: var(--fg)
    }

    .nav-item.active {
      background: var(--prBg);
      color: var(--pr);
      font-weight: 600
    }

    .sidebar.collapsed .nav-item {
      justify-content: center;
      padding: 9px;
      gap: 0
    }

    .nav-icon {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all var(--dn)
    }

    .sidebar.collapsed .nav-icon {
      width: 20px;
      height: 20px
    }

    .nav-label {
      font-size: 13px;
      transition: opacity var(--df)
    }

    .sidebar.collapsed .nav-label {
      display: none
    }

    .nav-badge {
      margin-left: auto;
      font-size: 10px;
      font-weight: 700;
      background: var(--exp);
      color: #fff;
      padding: 1px 5px;
      border-radius: 10px
    }

    .sidebar.collapsed .nav-badge {
      position: absolute;
      top: 3px;
      right: 3px;
      font-size: 8px;
      padding: 1px 4px;
      margin-left: 0
    }

    /* Tooltip — collapsed 时显示 */
    .nav-tip {
      position: fixed;
      left: 72px;
      padding: 6px 10px;
      background: var(--fg);
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      border-radius: var(--rs);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: translateX(-4px);
      transition: all var(--df);
      z-index: 400
    }

    .nav-item:hover+.nav-tip,
    .nav-item:hover .nav-tip {
      opacity: 1;
      transform: translateX(0)
    }

    /* Footer / User Area */
    .sidebar-footer {
      border-top: 1px solid var(--bdL);
      padding: 8px 12px;
      position: relative;
      transition: all var(--dn)
    }

    .sidebar.collapsed .sidebar-footer {
      padding: 8px 4px
    }

    .user-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 4px 0;
      border: none;
      background: none;
      width: 100%;
      font-family: var(--fn);
      transition: all var(--df)
    }

    .user-trigger:hover {
      opacity: 0.8
    }

    .sidebar.collapsed .user-trigger {
      justify-content: center;
      gap: 0
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--prGr);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover
    }

    .user-info {
      flex: 1;
      min-width: 0;
      text-align: left
    }

    .sidebar.collapsed .user-info {
      display: none
    }

    .user-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--fg);
      line-height: 1.2
    }

    .user-arrow {
      color: var(--fg3);
      font-size: 10px;
      transition: transform var(--df)
    }

    .user-arrow.open {
      transform: rotate(180deg)
    }

    .sidebar.collapsed .user-arrow {
      display: none
    }

    /* User Menu Popover — 向上弹出 */
    .user-menu {
      position: absolute;
      left: 8px;
      bottom: 100%;
      margin-bottom: 8px;
      width: 220px;
      background: var(--srf);
      border: 1px solid var(--bd);
      border-radius: var(--rm);
      box-shadow: var(--sh4);
      z-index: 200;
      overflow: hidden;
      display: none
    }

    .user-menu.active {
      display: block;
      animation: scaleIn 0.2s var(--sp)
    }

    .sidebar.collapsed .user-menu {
      left: 0;
      margin-left: 4px
    }

    .um-header {
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg)
    }

    .um-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--prGr);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      flex-shrink: 0
    }

    .um-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--fg)
    }

    .um-email {
      font-size: 11px;
      color: var(--fg3);
      margin-top: 1px
    }

    .um-divider {
      height: 1px;
      background: var(--bdL)
    }

    .um-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--fg2);
      cursor: pointer;
      transition: background var(--df)
    }

    .um-item:hover {
      background: var(--bg)
    }

    .um-item.danger {
      color: var(--exp)
    }

    .um-item.danger:hover {
      background: var(--expBg)
    }

    /* ── MAIN ── */
    .main {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px 28px;
      max-width: 1480px
    }

    .main::-webkit-scrollbar {
      width: 5px
    }

    .main::-webkit-scrollbar-track {
      background: transparent
    }

    .main::-webkit-scrollbar-thumb {
      background: var(--bd);
      border-radius: 3px
    }

    .view-panel {
      display: none
    }

    .view-panel.active {
      display: block;
      animation: fadeInUp var(--ds) var(--ease)
    }

    /* ── STATS ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 16px
    }

    .stat-card {
      background: var(--srf);
      border-radius: var(--rl);
      border: 1px solid var(--bd);
      padding: 20px 22px;
      transition: all var(--dn) var(--ease);
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100px
    }

    .stat-card:hover {
      transform: translateY(-1px);
      box-shadow: var(--sh2)
    }

    .stat-card.hero {
      background: var(--prGr);
      border: none;
      color: #fff
    }

    .stat-card.hero .stat-label {
      color: rgba(255, 255, 255, 0.75)
    }

    .stat-card.hero .stat-sub {
      color: rgba(255, 255, 255, 0.6)
    }

    .stat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px
    }

    .stat-icon {
      width: 28px;
      height: 28px;
      border-radius: var(--rs);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px
    }

    .stat-icon.inc {
      background: var(--incBg);
      color: var(--inc)
    }

    .stat-icon.exp {
      background: var(--expBg);
      color: var(--exp)
    }

    .stat-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--fg3)
    }

    .stat-value {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em
    }

    .stat-card:not(.hero) .stat-value {
      color: var(--fg)
    }

    .stat-card.hero .stat-value {
      color: #fff
    }

    .stat-sub {
      font-size: 11px;
      color: var(--fg3);
      margin-top: 2px
    }

    /* ── CARDS ── */
    .dash-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 14px;
      margin-bottom: 14px
    }

    .dash-card {
      background: var(--srf);
      border-radius: var(--rl);
      border: 1px solid var(--bd);
      padding: 18px 22px;
      transition: all var(--dn) var(--ease)
    }

    .dash-card:hover {
      box-shadow: var(--sh1)
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px
    }

    .card-header h3 {
      font-size: 14px;
      font-weight: 600
    }

    .card-action {
      font-size: 12px;
      color: var(--pr);
      font-weight: 500;
      cursor: pointer
    }

    .card-action:hover {
      opacity: 0.8
    }

    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px
    }

    .quick-action {
      background: var(--srf);
      border: 1px solid var(--bd);
      border-radius: var(--rl);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all var(--dn) var(--ease)
    }

    .quick-action:hover {
      border-color: var(--prBd);
      box-shadow: var(--sh2)
    }

    .qa-icon {
      width: 34px;
      height: 34px;
      border-radius: var(--rm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0
    }

    .qa-icon.add {
      background: var(--prBg);
      color: var(--pr)
    }

    .qa-icon.report {
      background: var(--infoBg);
      color: var(--info)
    }

    .qa-info h4 {
      font-size: 13px;
      font-weight: 600
    }

    .qa-info p {
      font-size: 11px;
      color: var(--fg3)
    }

    /* ── TXN LIST ── */
    .txn-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--bdL);
      border-radius: var(--rs);
      overflow: hidden
    }

    .txn-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--srf);
      transition: background var(--df);
      cursor: pointer
    }

    .txn-row:hover {
      background: var(--srfH)
    }

    .txn-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--rs);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0
    }

    .txn-info {
      flex: 1;
      min-width: 0
    }

    .txn-title {
      font-size: 13px;
      font-weight: 600
    }

    .txn-meta {
      font-size: 11px;
      color: var(--fg3);
      margin-top: 1px;
      display: flex;
      gap: 6px
    }

    .txn-amount {
      font-size: 14px;
      font-weight: 700;
      text-align: right;
      white-space: nowrap
    }

    .txn-amount.debit {
      color: var(--exp)
    }

    .txn-amount.credit {
      color: var(--inc)
    }

    .txn-sign {
      font-size: 11px;
      font-weight: 600
    }

    /* ── FILTER / TABLE ── */
    .filter-sticky {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg);
      padding: 10px 0 8px;
      margin-bottom: 10px
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      padding: 7px;
      background: var(--srf);
      border-radius: var(--rm);
      border: 1px solid var(--bd)
    }

    .filter-chip {
      padding: 5px 12px;
      border: 1px solid var(--bd);
      border-radius: 16px;
      font-size: 12px;
      font-weight: 500;
      color: var(--fg2);
      cursor: pointer;
      background: var(--srf);
      transition: all var(--df);
      white-space: nowrap
    }

    .filter-chip:hover {
      border-color: var(--prBd)
    }

    .filter-chip.active {
      background: var(--fg);
      color: #fff;
      border-color: var(--fg)
    }

    .filter-summary {
      font-size: 11px;
      color: var(--fg3);
      margin-left: auto;
      white-space: nowrap
    }

    .load-more {
      text-align: center;
      padding: 14px;
      color: var(--fg3);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500
    }

    .load-more:hover {
      color: var(--pr)
    }

    .srch-wrap {
      position: relative;
      flex: 1;
      min-width: 140px;
      max-width: 240px
    }

    .srch-wrap input {
      width: 100%;
      padding: 7px 12px 7px 30px;
      border: 1px solid var(--bd);
      border-radius: 20px;
      font-size: 12px;
      font-family: var(--fn);
      background: var(--bg)
    }

    .srch-wrap input:focus {
      outline: none;
      border-color: var(--pr);
      box-shadow: 0 0 0 2px var(--prBg)
    }

    .srch-wrap .si {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--fg3)
    }

    .data-table {
      width: 100%;
      border-collapse: collapse
    }

    .data-table th {
      text-align: left;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--fg3);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--bd)
    }

    .data-table td {
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 500;
      border-bottom: 1px solid var(--bdL);
      color: var(--fg)
    }

    .data-table tbody tr {
      transition: background var(--df);
      cursor: pointer
    }

    .data-table tbody tr:hover {
      background: var(--srfH)
    }

    .cell-amount {
      font-weight: 700;
      text-align: right
    }

    .cell-amount.debit {
      color: var(--exp)
    }

    .cell-amount.credit {
      color: var(--inc)
    }

    .cell-cat {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      background: var(--bg);
      border-radius: 14px;
      font-size: 11px;
      font-weight: 500
    }

    /* ── ADD (et-width layout) ── */
    .add-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: start
    }

    .add-left,
    .add-right {
      background: var(--srf);
      border: 1px solid var(--bd);
      border-radius: var(--rl);
      padding: 22px 24px;
      transition: all var(--dn) var(--ease)
    }

    .add-left:hover,
    .add-right:hover {
      box-shadow: var(--sh2)
    }

    .add-right h4 {
      margin-bottom: 14px;
      font-size: 14px;
      font-weight: 600
    }

    .sc-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .sc-item {
      padding: 16px 12px;
      background: var(--bg);
      border-radius: var(--rm);
      cursor: pointer;
      transition: all var(--df);
      text-align: center;
      border: 1px solid transparent
    }

    .sc-item:hover {
      background: var(--prBg);
      border-color: var(--prBd)
    }

    .sc-icon {
      font-size: 26px;
      margin-bottom: 6px
    }

    .sc-name {
      font-size: 13px;
      font-weight: 600
    }

    .sc-desc {
      font-size: 10px;
      color: var(--fg3);
      margin-top: 2px
    }

    /* ── FORM ── */
    .form-group {
      margin-bottom: 12px
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--fg2);
      margin-bottom: 4px
    }

    .form-input,
    .form-select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--bd);
      border-radius: var(--rs);
      background: var(--srf);
      font-size: 13px;
      font-family: var(--fn);
      color: var(--fg);
      transition: border-color var(--df)
    }

    .form-input:focus,
    .form-select:focus {
      outline: none;
      border-color: var(--pr);
      box-shadow: 0 0 0 3px var(--prBg)
    }

    .form-input.amt {
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      padding: 14px
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .form-error {
      font-size: 11px;
      color: var(--exp);
      margin-top: 3px;
      display: none
    }

    .form-error.visible {
      display: block
    }

    .form-tabs {
      display: flex;
      border: 1px solid var(--bd);
      border-radius: var(--rs);
      overflow: hidden;
      margin-bottom: 14px
    }

    .form-tabs button {
      flex: 1;
      padding: 9px;
      border: none;
      background: transparent;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--fn);
      transition: all var(--df)
    }

    .form-tabs button:first-child {
      border-right: 1px solid var(--bd)
    }

    .form-tabs button.active {
      background: var(--fg);
      color: #fff
    }

    .loc-btn {
      width: 100%;
      padding: 9px 12px;
      border: 1px dashed var(--info);
      border-radius: var(--rm);
      background: var(--infoBg);
      color: var(--info);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all var(--df);
      font-family: var(--fn)
    }

    .loc-btn:hover {
      background: #D8E8F7
    }

    .loc-btn.sel {
      border-style: solid;
      background: var(--incBg);
      color: var(--inc);
      border-color: var(--inc)
    }

    .upz {
      border: 1px dashed var(--bd);
      border-radius: var(--rm);
      padding: 14px;
      text-align: center;
      cursor: pointer;
      transition: all var(--df);
      background: var(--bg)
    }

    .upz:hover {
      border-color: var(--prBd);
      background: var(--prBg)
    }

    .upz .uzi {
      font-size: 22px;
      margin-bottom: 4px;
      opacity: 0.5
    }

    .upz .uzt {
      font-size: 11px;
      color: var(--fg3)
    }

    .upz.on {
      border-style: solid;
      background: var(--incBg);
      border-color: var(--inc)
    }

    .upz.on .uzt {
      color: var(--inc);
      font-weight: 600
    }

    /* ── BUDGET ── */
    .budget-item {
      margin-bottom: 12px
    }

    .budget-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      align-items: center
    }

    .budget-name {
      font-size: 13px;
      font-weight: 600
    }

    .budget-amount {
      font-size: 12px;
      font-weight: 500;
      color: var(--fg2);
      display: flex;
      align-items: center;
      gap: 6px
    }

    .budget-actions {
      display: flex;
      gap: 3px;
      opacity: 0;
      transition: opacity var(--df)
    }

    .budget-item:hover .budget-actions {
      opacity: 1
    }

    .budget-actions button {
      background: var(--bg);
      border: 1px solid var(--bd);
      border-radius: 5px;
      font-size: 10px;
      cursor: pointer;
      color: var(--fg3);
      padding: 2px 6px
    }

    .budget-actions button:hover {
      background: var(--srf);
      color: var(--fg);
      border-color: var(--prBd)
    }

    .budget-actions button.del:hover {
      color: var(--exp);
      border-color: var(--exp)
    }

    .budget-bar {
      height: 5px;
      background: var(--bg);
      border-radius: 3px;
      overflow: hidden
    }

    .fill {
      height: 100%;
      border-radius: 3px;
      transition: width var(--ds) var(--sp)
    }

    .fill.safe {
      background: var(--prGr)
    }

    .fill.warn {
      background: linear-gradient(90deg, #E8A838, #F0C040)
    }

    .fill.danger {
      background: linear-gradient(90deg, #E06055, #F08075)
    }

    .budget-percent {
      font-size: 11px;
      color: var(--fg3);
      margin-top: 2px
    }

    /* ── REPORT ── */
    .rprs-row {
      display: flex;
      gap: 4px;
      margin-bottom: 14px;
      padding: 3px;
      background: var(--srf);
      border-radius: var(--rm);
      border: 1px solid var(--bd);
      width: fit-content
    }

    .rprs {
      padding: 6px 14px;
      border: none;
      background: transparent;
      border-radius: var(--rs);
      font-size: 12px;
      font-weight: 600;
      color: var(--fg2);
      cursor: pointer;
      font-family: var(--fn);
      transition: all var(--df)
    }

    .rprs:hover {
      color: var(--fg)
    }

    .rprs.active {
      background: var(--fg);
      color: #fff
    }

    .cc {
      display: flex;
      align-items: flex-end;
      gap: 16px;
      padding: 16px 0
    }

    .cg {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px
    }

    .cg-bars {
      display: flex;
      gap: 6px;
      align-items: flex-end;
      height: 150px
    }

    .cb {
      width: 32px;
      border-radius: 4px 4px 0 0;
      transition: height var(--ds) var(--sp);
      position: relative
    }

    .cb.debit {
      background: var(--exp)
    }

    .cb.credit {
      background: var(--inc)
    }

    .cb .ct {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      font-weight: 600;
      white-space: nowrap;
      color: var(--fg2)
    }

    .cg-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--fg3)
    }

    /* ── CALENDAR ── */
    .cal-header-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      position: relative;
      cursor: pointer
    }

    .cal-header-row h3 {
      font-size: 14px;
      font-weight: 600
    }

    .cal-picker-drop {
      position: absolute;
      top: 100%;
      left: 0;
      background: var(--srf);
      border: 1px solid var(--bd);
      border-radius: var(--rm);
      box-shadow: var(--sh3);
      z-index: 100;
      display: none;
      padding: 8px;
      min-width: 200px
    }

    .cal-picker-drop.active {
      display: block;
      animation: scaleIn 0.2s var(--sp)
    }

    .cal-ym-row {
      display: flex;
      gap: 8px
    }

    .cal-ym-row select {
      padding: 6px 10px;
      border: 1px solid var(--bd);
      border-radius: var(--rs);
      font-size: 12px;
      font-family: var(--fn)
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      background: var(--bdL);
      border-radius: var(--rs);
      overflow: hidden
    }

    .cal-hd {
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      color: var(--fg3);
      padding: 8px 0;
      background: var(--srf)
    }

    .cal-cell {
      background: var(--srf);
      padding: 6px;
      min-height: 68px;
      cursor: pointer;
      transition: background var(--df);
      display: flex;
      flex-direction: column
    }

    .cal-cell:hover {
      background: var(--srfH)
    }

    .cal-cell.other {
      opacity: 0.3;
      pointer-events: none
    }

    .cal-cell.today {
      background: var(--prBg)
    }

    .cal-cell .cd-date {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 2px
    }

    .cal-cell.today .cd-date {
      color: var(--pr)
    }

    .cal-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--pr);
      margin-bottom: 3px
    }

    .cd-stats {
      font-size: 9px;
      line-height: 1.4;
      color: var(--fg3);
      margin-top: auto
    }

    .cal-summary-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 16px
    }

    .cal-stat {
      padding: 14px;
      background: var(--srf);
      border: 1px solid var(--bd);
      border-radius: var(--rm);
      text-align: center
    }

    .cal-stat .cs-lbl {
      font-size: 10px;
      color: var(--fg3);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px
    }

    .cal-stat .cs-val {
      font-size: 18px;
      font-weight: 700
    }

    .cs-val.exp {
      color: var(--exp)
    }

    .cs-val.inc {
      color: var(--inc)
    }

    .cs-val.neutral {
      color: var(--fg)
    }

    /* ── SEGMENT ── */
    .seg-control {
      display: flex;
      border: 1px solid var(--bd);
      border-radius: var(--rm);
      overflow: hidden;
      width: fit-content;
      margin-bottom: 14px;
      background: var(--srf)
    }

    .seg-opt {
      padding: 8px 20px;
      border: none;
      background: transparent;
      font-size: 13px;
      font-weight: 600;
      color: var(--fg2);
      cursor: pointer;
      font-family: var(--fn);
      transition: all var(--df)
    }

    .seg-opt:first-child {
      border-right: 1px solid var(--bd)
    }

    .seg-opt.active {
      background: var(--fg);
      color: #fff
    }

    /* ── CATS / BOOKS / TPLS ── */
    .cat-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    .cat-card {
      width: 150px;
      padding: 14px;
      background: var(--srf);
      border: 1px solid var(--bd);
      border-radius: var(--rm);
      text-align: center;
      cursor: grab;
      transition: all var(--df);
      user-select: none;
      position: relative
    }

    .cat-card:hover {
      box-shadow: var(--sh2)
    }

    .cat-card.dragging {
      opacity: 0.5;
      border-style: dashed
    }

    .cat-card.drag-over {
      border-color: var(--pr);
      box-shadow: 0 0 0 2px var(--prBg)
    }

    .cat-e {
      font-size: 28px;
      margin-bottom: 6px
    }

    .cat-n {
      font-size: 12px;
      font-weight: 600
    }

    .cat-handle {
      position: absolute;
      top: 6px;
      left: 6px;
      font-size: 10px;
      color: var(--fg3);
      display: none
    }

    .sort-mode .cat-handle {
      display: block
    }

    .bk-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 6px
    }

    .bk-card {
      padding: 20px;
      background: var(--srf);
      border: 1px solid var(--bd);
      border-radius: var(--rl);
      cursor: pointer;
      transition: all var(--dn) var(--ease);
      position: relative
    }

    .bk-card:hover {
      border-color: var(--prBd);
      box-shadow: var(--sh2)
    }

    .bk-card.active {
      border-color: var(--pr);
      box-shadow: 0 0 0 3px var(--prBg)
    }

    .bk-acts {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity var(--df)
    }

    .bk-card:hover .bk-acts {
      opacity: 1
    }

    .bk-acts button {
      padding: 3px 8px;
      font-size: 10px;
      border-radius: 5px;
      border: 1px solid var(--bd);
      background: var(--srf);
      cursor: pointer;
      color: var(--fg3)
    }

    .bk-card h4 {
      font-size: 14px;
      margin-bottom: 4px
    }

    .bk-meta {
      font-size: 12px;
      color: var(--fg3)
    }

    .bk-card.add-new {
      border-style: dashed;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 90px;
      color: var(--fg3);
      font-size: 13px
    }

    .tpl-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 6px
    }

    .tpl-card {
      padding: 14px;
      background: var(--srf);
      border: 1px solid var(--bd);
      border-radius: var(--rm);
      cursor: pointer;
      transition: all var(--df);
      position: relative
    }

    .tpl-card:hover {
      border-color: var(--prBd);
      box-shadow: var(--sh2)
    }

    .tpl-e {
      font-size: 22px;
      margin-bottom: 6px
    }

    .tpl-n {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 2px
    }

    .tpl-m {
      font-size: 11px;
      color: var(--fg3)
    }

    .tpl-acts {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 2px;
      opacity: 0;
      transition: opacity var(--df)
    }

    .tpl-card:hover .tpl-acts {
      opacity: 1
    }

    .tpl-acts button {
      background: var(--srf);
      border: 1px solid var(--bd);
      border-radius: 5px;
      padding: 2px 6px;
      font-size: 10px;
      cursor: pointer;
      color: var(--fg3)
    }

    .tpl-acts button:hover {
      color: var(--fg)
    }

    .tpl-card.add-new {
      border-style: dashed;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 90px;
      color: var(--fg3);
      font-size: 13px
    }

    /* ── ANNUAL ── */
    .annual-cover {
      text-align: center;
      padding: 60px 24px;
      background: var(--prGr);
      border-radius: var(--rl);
      color: #fff;
      margin-bottom: 20px
    }

    .ac-year {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px
    }

    .ac-sub {
      font-size: 16px;
      opacity: 0.8
    }

    .ann-sec {
      margin-bottom: 20px
    }

    .ann-sec h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 14px
    }

    .ann-overview {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px
    }

    .ann-ov-card {
      background: var(--srf);
      border: 1px solid var(--bd);
      border-radius: var(--rm);
      padding: 18px;
      text-align: center
    }

    .aov-lbl {
      font-size: 11px;
      color: var(--fg3);
      margin-bottom: 4px
    }

    .aov-val {
      font-size: 22px;
      font-weight: 700
    }

    .aov-val.inc {
      color: var(--inc)
    }

    .aov-val.exp {
      color: var(--exp)
    }

    .ann-records {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px
    }

    .ann-rec-card {
      background: var(--srf);
      border: 1px solid var(--bd);
      border-radius: var(--rm);
      padding: 16px;
      text-align: center
    }

    .arc-icon {
      font-size: 24px;
      margin-bottom: 6px
    }

    .arc-title {
      font-size: 11px;
      color: var(--fg3);
      margin-bottom: 4px
    }

    .arc-val {
      font-size: 16px;
      font-weight: 700
    }

    .ann-fun {
      background: var(--prBg);
      border-radius: var(--rm);
      padding: 16px 20px;
      font-size: 13px;
      color: var(--pr);
      font-weight: 500
    }

    /* ── BTN ── */
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: var(--rs);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--fn);
      transition: all var(--df);
      display: inline-flex;
      align-items: center;
      gap: 6px
    }

    .btn-primary {
      background: var(--fg);
      color: #fff
    }

    .btn-primary:hover {
      background: #000
    }

    .btn-secondary {
      background: var(--srf);
      color: var(--fg);
      border: 1px solid var(--bd)
    }

    .btn-secondary:hover {
      background: var(--bg)
    }

    .btn-outline {
      background: transparent;
      color: var(--pr);
      border: 1px solid var(--prBd)
    }

    .btn-outline:hover {
      background: var(--prBg)
    }

    .btn-sm {
      padding: 5px 12px;
      font-size: 11px
    }

    .btn-xs {
      padding: 3px 8px;
      font-size: 10px
    }

    .btn-ghost {
      background: transparent;
      color: var(--fg2)
    }

    .btn-ghost:hover {
      background: var(--bg)
    }

    .btn-danger {
      background: var(--exp);
      color: #fff
    }

    .btn-danger:hover {
      background: #c05045
    }

    .btn-saving {
      pointer-events: none;
      opacity: 0.8
    }

    .btn-saving::after {
      content: '';
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-left: 6px
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    /* ── MODAL / TOAST ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--ov);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.2s ease
    }

    .modal-overlay.active {
      display: flex
    }

    .modal {
      background: var(--srf);
      border-radius: var(--rx);
      box-shadow: var(--sh3);
      max-width: 460px;
      width: 92%;
      max-height: 85vh;
      overflow-y: auto;
      animation: scaleIn 0.25s var(--sp)
    }

    .modal.wide {
      max-width: 600px
    }

    .modal-header {
      padding: 20px 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .modal-header h2 {
      font-size: 16px;
      font-weight: 700
    }

    .modal-close {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--bg);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--fg3)
    }

    .modal-close:hover {
      background: var(--srfA);
      color: var(--fg)
    }

    .modal-body {
      padding: 20px
    }

    .modal-footer {
      padding: 0 20px 20px;
      display: flex;
      gap: 10px;
      justify-content: flex-end
    }

    .modal-footer.start {
      justify-content: flex-start
    }

    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 400;
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .toast {
      padding: 10px 18px;
      border-radius: var(--rm);
      font-size: 12px;
      font-weight: 600;
      box-shadow: var(--sh3);
      animation: tin 0.3s var(--sp);
      display: flex;
      align-items: center;
      gap: 8px
    }

    .toast.success {
      background: #E7F5F2;
      color: var(--pr);
      border: 1px solid var(--prBd)
    }

    .toast.error {
      background: var(--expBg);
      color: var(--exp)
    }

    .toast.info {
      background: var(--infoBg);
      color: var(--info)
    }

    .toast.removing {
      animation: tout 0.25s ease forwards
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.95)
      }

      to {
        opacity: 1;
        transform: scale(1)
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes tin {
      from {
        opacity: 0;
        transform: translateX(40px)
      }

      to {
        opacity: 1;
        transform: translateX(0)
      }
    }

    @keyframes tout {
      from {
        opacity: 1;
        transform: translateX(0)
      }

      to {
        opacity: 0;
        transform: translateX(40px)
      }
    }

    @media(max-width:1024px) {
      .stats-row {
        grid-template-columns: 1fr 1fr
      }

      .dash-grid {
        grid-template-columns: 1fr
      }

      .add-grid {

      }

      .bk-grid {
        grid-template-columns: 1fr 1fr
      }

      .tpl-grid {
        grid-template-columns: 1fr 1fr
      }
    }
  </style>

    function resetAdd() { document.getElementById('inpAmt').value = ''; document.getElementById('inpNote').value = ''; document.getElementById('errAmt').classList.remove('visible'); S.addLoc = null; S.txnType = 'expense'; rA() } function toggleUpload() { const z = document.getElementById('uploadZone'); const t = document.getElementById('uploadText'); const h = z.classList.contains('on'); z.classList.toggle('on', !h); t.textContent = h ? '点击上传附件/收据' : '已上传: receipt.jpg' }
    function openTemplateSelectModal() { document.getElementById('mdlTplSelectBody').innerHTML = TEMPLATES.map(tp => { const c = gcat(tp.ci); return '<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--bdL);border-radius:var(--rs);margin-bottom:6px;cursor:pointer" onclick="selectTplFromModal(\'' + tp.id + '\')"><span style="font-size:20px">' + c.e + '</span><div style="flex:1"><div style="font-size:13px;font-weight:600">' + tp.n + '</div><div style="font-size:11px;color:var(--fg3)">' + (tp.t === 'expense' ? '支出' : '收入') + ' · ' + fmt(tp.a) + '</div></div></div>' }).join(''); openM('modalTplSelect') }
    function selectTplFromModal(tid) { const tp = TEMPLATES.find(x => x.id === tid); if (!tp) return; S.txnType = tp.t; rA(); setTimeout(() => { document.getElementById('inpAmt').value = tp.a; document.getElementById('inpCat').value = tp.ci; document.getElementById('inpNote').value = gcat(tp.ci).n }, 50); closeM('modalTplSelect'); tst('模板已应用', 'success') } function useTpl(tid) { selectTplFromModal(tid); switchView('add') }
    function openAddBudget() { S.ebi = null; document.getElementById('mdlBudgetTitle').textContent = '新增预算'; const used = new Set(ab().map(b => b.ci)); document.getElementById('inpBudgetCat').innerHTML = cbt('expense').filter(c => !used.has(c.id)).map(c => '<option value="' + c.id + '">' + c.e + ' ' + c.n + '</option>').join(''); document.getElementById('inpBudgetAmt').value = ''; openM('modalAddBudget') }
    function openEditBudget(bid) { S.ebi = bid; const b = BUDGETS.find(x => x.id === bid); if (!b) return; document.getElementById('mdlBudgetTitle').textContent = '修改预算'; document.getElementById('inpBudgetCat').innerHTML = '<option value="' + b.ci + '">' + gcat(b.ci).e + ' ' + gcat(b.ci).n + '</option>'; document.getElementById('inpBudgetCat').disabled = true; document.getElementById('inpBudgetAmt').value = b.l; openM('modalAddBudget') }
    function submitBudget() { const ci = document.getElementById('inpBudgetCat').value; const l = parseFloat(document.getElementById('inpBudgetAmt').value); if (!ci || isNaN(l) || l <= 0) return tst('请填写完整', 'error'); if (S.ebi) { const b = BUDGETS.find(x => x.id === S.ebi); if (b) b.l = l; tst('已更新', 'success') } else { BUDGETS.push({ id: 'b' + Date.now(), ci, l, bk: S.cb }); tst('已创建', 'success') } closeM('modalAddBudget'); S.ebi = null; render() } function confirmDelBgt(bid) { S.ccb = () => { BUDGETS.splice(BUDGETS.findIndex(b => b.id === bid), 1); closeM('modalConfirm'); tst('已删除', 'success'); render() }; document.getElementById('mdlConfirmBody').innerHTML = '<p>确定删除？</p>'; openM('modalConfirm') }
    function selectBook(id) { S.cb = id; switchView('dashboard'); updateBS() } function openAddBook() { S.ebk = null; document.getElementById('mdlBookTitle').textContent = '新建账本'; document.getElementById('inpBookName').value = ''; document.getElementById('inpBookDesc').value = ''; document.getElementById('inpBookEmoji').value = ''; openM('modalAddBook') } function openEditBook(bid) { S.ebk = bid; const b = BOOKS.find(x => x.id === bid); if (!b) return; document.getElementById('mdlBookTitle').textContent = '编辑账本'; document.getElementById('inpBookName').value = b.n; document.getElementById('inpBookDesc').value = b.d; document.getElementById('inpBookEmoji').value = b.e; openM('modalAddBook') }
    function submitBook() { const nm = document.getElementById('inpBookName').value.trim(); if (!nm) return tst('请输入名称', 'error'); const em = document.getElementById('inpBookEmoji').value.trim(), ds = document.getElementById('inpBookDesc').value.trim(); if (S.ebk) { const b = BOOKS.find(x => x.id === S.ebk); if (b) { b.n = nm; b.d = ds; if (em) b.e = em } tst('已更新', 'success') } else { BOOKS.push({ id: 'bk' + Date.now(), n: nm, e: em || '📒', c: '#888', m: 1, d: ds || '新创建' }); tst('已创建', 'success') } closeM('modalAddBook'); S.ebk = null; render(); updateBS() } function confirmDelBook(bid) { S.ccb = () => { if (bid === 'bh') { tst('不能删除默认', 'error'); closeM('modalConfirm'); return } BOOKS.splice(BOOKS.findIndex(x => x.id === bid), 1); if (S.cb === bid) { S.cb = 'bh'; updateBS() } closeM('modalConfirm'); tst('已删除', 'success'); render() }; document.getElementById('mdlConfirmBody').innerHTML = '<p>确定删除？</p>'; openM('modalConfirm') }
    function copyTpl(tid) { const tp = TEMPLATES.find(x => x.id === tid); TEMPLATES.push({ id: 'tp' + Date.now(), n: tp.n + ' (副本)', ci: tp.ci, a: tp.a, t: tp.t }); document.getElementById('cp' + tid).textContent = '✓'; render(); tst('已复制', 'success') } function confirmDelTpl(tid) { S.ccb = () => { TEMPLATES.splice(TEMPLATES.findIndex(x => x.id === tid), 1); closeM('modalConfirm'); tst('已删除', 'success'); render() }; document.getElementById('mdlConfirmBody').innerHTML = '<p>确定删除？</p>'; openM('modalConfirm') }
    function openMapForAdd() { document.getElementById('mapSearchInput').value = ''; document.getElementById('mapSelected').style.display = 'none'; document.getElementById('mapResults').innerHTML = MAPS.map(p => '<div style="padding:10px 14px;border-bottom:1px solid var(--bdL);cursor:pointer;display:flex;align-items:center;gap:10px" onclick="pickMap(\'' + p.n + '\',\'' + p.ad + '\',' + p.la + ',' + p.lo + ')"><div style="width:30px;height:30px;background:var(--infoBg);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--info)">📍</div><div><div style="font-size:13px;font-weight:600">' + p.n + '</div><div style="font-size:11px;color:var(--fg3)">' + p.ad + '</div></div></div>').join(''); openM('modalMap') }
    function mapSearch() { const q = document.getElementById('mapSearchInput').value.toLowerCase(); document.getElementById('mapResults').innerHTML = MAPS.filter(p => p.n.toLowerCase().includes(q) || p.ad.toLowerCase().includes(q)).map(p => '<div style="padding:10px 14px;border-bottom:1px solid var(--bdL);cursor:pointer;display:flex;align-items:center;gap:10px" onclick="pickMap(\'' + p.n + '\',\'' + p.ad + '\',' + p.la + ',' + p.lo + ')"><div style="width:30px;height:30px;background:var(--infoBg);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--info)">📍</div><div><div style="font-size:13px;font-weight:600">' + p.n + '</div><div style="font-size:11px;color:var(--fg3)">' + p.ad + '</div></div></div>').join('') }
    function pickMap(n, ad, la, lo) { document.getElementById('mapSelected').style.display = 'block'; document.getElementById('mapSelectedName').textContent = n; document.getElementById('mapSelectedAddr').textContent = ad + ' · ' + la + ', ' + lo; window._mp = { n, ad, la: parseFloat(la), lo: parseFloat(lo) } } function confirmMapPick() { if (!window._mp) return tst('请先选择地点', 'error'); S.addLoc = window._mp; closeM('modalMap'); rA(); tst('地点已选择', 'success'); window._mp = null }
    function toggleBookDropdown() { const dd = document.getElementById('bookDropdown'); dd.classList.toggle('active'); if (dd.classList.contains('active')) dd.innerHTML = BOOKS.map(b => '<div class="book-opt" onclick="selectBook(\'' + b.id + '\');toggleBookDropdown()"><div class="bdot" style="background:' + b.c + '"></div>' + b.e + ' ' + b.n + (b.id === S.cb ? '<span style="margin-left:auto;font-size:10px;color:var(--pr)">✓</span>' : '') + '</div>').join('') } function updateBS() { const b = cb(); document.getElementById('bsA').textContent = b.e || '家'; document.getElementById('bsN').textContent = b.n }
    function openM(id) { document.getElementById(id).classList.add('active') } function closeM(id) { document.getElementById(id).classList.remove('active') } function execConfirm() { if (S.ccb) { S.ccb(); S.ccb = null } } function tst(msg, ty) { const c = document.getElementById('toastContainer'); const e = document.createElement('div'); e.className = 'toast ' + ty; e.textContent = msg; c.appendChild(e); setTimeout(() => { e.classList.add('removing'); setTimeout(() => e.remove(), 250) }, 2500) }
    document.addEventListener('click', function (e) { if (e.target.classList.contains('modal-overlay')) closeM(e.target.id); const dd = document.getElementById('bookDropdown'); if (dd && dd.classList.contains('active') && !e.target.closest('#bookSwitcher') && !e.target.closest('#bookDropdown')) dd.classList.remove('active'); const cp = document.querySelector('.cal-picker-drop.active'); if (cp && !e.target.closest('.cal-header-row')) { S.showCalPicker = false; rC() } if (userMenuOpen && !e.target.closest('#userArea')) { userMenuOpen = false; document.getElementById('userMenu').classList.remove('active'); document.getElementById('userArrow').classList.remove('open') } });
    render(); updateBS();
  </script>
