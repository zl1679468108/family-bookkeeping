<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>静记 · 认证页面设计</title>
<style>
/* ═══════════════════════════════════════════
   静记 — Auth Pages Design
   登录/注册/忘记密码 + SVG 插画
   ═══════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap');
:root {
  --pr:#2D9D8A;--prL:#45B7A7;--prD:#1A7A6A;--prBg:#E7F5F2;--prGr:linear-gradient(135deg,#2D9D8A 0%,#45B7A7 100%);
  --bg:#F6F7F4;--srf:#FFF;--fg:#1A1C19;--fg2:#5A5D58;--fg3:#8B8E89;--bd:#E0E2DD;
  --inc:#3BA272;--exp:#E06055;--info:#4A90D9;
  --rs:8px;--rm:12px;--rl:18px;--sh1:0 1px 2px rgba(0,0,0,0.04);--sh2:0 4px 16px rgba(0,0,0,0.08);--sh3:0 12px 40px rgba(0,0,0,0.12);
  --fn:'DM Sans',-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;
  --ease:cubic-bezier(0.25,0,0,1);--sp:cubic-bezier(0.34,1.56,0.64,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{font-family:var(--fn);background:var(--bg);color:var(--fg);line-height:1.5;height:100vh;overflow:hidden}

/* Page switcher for demo */
.page-tabs{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:4px;background:var(--srf);border-radius:var(--rm);border:1px solid var(--bd);z-index:10;box-shadow:var(--sh1)}.page-tab{padding:8px 18px;border:none;background:transparent;border-radius:var(--rs);font-size:13px;font-weight:600;color:var(--fg2);cursor:pointer;font-family:var(--fn);transition:all 0.15s}.page-tab:hover{color:var(--fg)}.page-tab.active{background:var(--pr);color:#fff}

/* Auth container */
.auth-page{display:none;height:100vh;overflow:hidden}.auth-page.active{display:flex;animation:fadeIn 0.4s ease}

/* Left panel — Illustration */
.auth-illus{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--prGr)}
.auth-illus .illus-bg{position:absolute;inset:0;opacity:0.08}
.auth-illus .illus-bg .deco-circle{position:absolute;border-radius:50%;background:#fff}
.auth-illus .illus-content{position:relative;z-index:1;text-align:center;padding:40px}
.auth-illus h2{font-size:32px;font-weight:700;color:#fff;margin-bottom:12px;letter-spacing:-0.02em}
.auth-illus .illus-sub{font-size:14px;color:rgba(255,255,255,0.7);margin-bottom:24px;line-height:1.6}
.auth-illus .illus-svg{width:280px;height:280px;display:inline-block}
.auth-illus .illus-footer{color:rgba(255,255,255,0.5);font-size:12px;position:absolute;bottom:24px;left:50%;transform:translateX(-50%)}

/* Right panel — Form */
.auth-form{width:480px;min-width:480px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 56px;background:var(--srf);overflow-y:auto}
.auth-form .form-inner{width:100%;max-width:380px}
.auth-form .form-logo{display:flex;align-items:center;gap:10px;margin-bottom:8px;justify-content:center}.form-logo .fl-icon{width:38px;height:38px;background:var(--prGr);border-radius:var(--rm);display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;font-weight:700}.form-logo .fl-text{font-size:20px;font-weight:700}
.auth-form h3{font-size:22px;font-weight:700;text-align:center;margin-bottom:4px}
.auth-form .form-desc{font-size:13px;color:var(--fg3);text-align:center;margin-bottom:28px}
.auth-form label{display:block;font-size:12px;font-weight:600;color:var(--fg2);margin-bottom:5px}
.auth-form input{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:var(--rs);font-size:14px;font-family:var(--fn);color:var(--fg);transition:border-color 0.15s;outline:none}
.auth-form input:focus{border-color:var(--pr);box-shadow:0 0 0 3px var(--prBg)}
.auth-form input.error{border-color:var(--exp)}.auth-form .field-error{font-size:11px;color:var(--exp);margin-top:3px;display:none}.auth-form .field-error.show{display:block}
.auth-form .form-group{margin-bottom:16px}
.auth-form .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.auth-form .btn-submit{width:100%;padding:12px;background:var(--prGr);border:none;border-radius:var(--rs);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--fn);transition:all 0.2s;margin-top:8px}.auth-form .btn-submit:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(45,157,138,0.35)}.auth-form .btn-submit:disabled{opacity:0.6;pointer-events:none}
.auth-form .form-links{display:flex;justify-content:space-between;font-size:13px;margin-top:20px}.auth-form .form-links a{color:var(--pr);text-decoration:none;font-weight:500;cursor:pointer;transition:color 0.15s}.auth-form .form-links a:hover{color:var(--prD)}
.auth-form .form-divider{display:flex;align-items:center;gap:12px;margin:20px 0;font-size:12px;color:var(--fg3)}.form-divider::before,.form-divider::after{content:'';flex:1;height:1px;background:var(--bd)}
.auth-form .step-indicator{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:24px}
.step-dot{width:10px;height:10px;border-radius:50%;background:var(--bd);transition:all 0.3s}.step-dot.active{background:var(--pr);box-shadow:0 0 6px rgba(45,157,138,0.4)}.step-dot.done{background:var(--inc)}
.step-line{width:40px;height:2px;background:var(--bd);transition:all 0.3s}.step-line.done{background:var(--inc)}
.success-card{text-align:center;padding:20px 0}.success-card .sc-icon{font-size:56px;margin-bottom:12px}.success-card h4{font-size:18px;font-weight:700;margin-bottom:4px}.success-card p{font-size:13px;color:var(--fg3)}

/* Countdown button */
.btn-code{padding:8px 16px;border:1px solid var(--pr);border-radius:var(--rs);background:transparent;color:var(--pr);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--fn);transition:all 0.15s;white-space:nowrap}.btn-code:hover{background:var(--prBg)}.btn-code:disabled{opacity:0.4;cursor:not-allowed}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(max-width:900px){.auth-page{flex-direction:column}.auth-illus{display:none}.auth-form{width:100%;min-width:auto;padding:40px 24px}}
</style>
</head>
<body>

<!-- Page Switcher -->
<div class="page-tabs">
  <button class="page-tab active" onclick="switchPage('login')">登录</button>
  <button class="page-tab" onclick="switchPage('register')">注册</button>
  <button class="page-tab" onclick="switchPage('forgot')">忘记密码</button>
</div>

<!-- ═══ LOGIN ═══ -->
<div class="auth-page active" id="page-login">
  <!-- Left: Illustration -->
  <div class="auth-illus">
    <div class="illus-bg">
      <div class="deco-circle" style="width:420px;height:420px;top:-100px;right:-120px;opacity:0.06"></div>
      <div class="deco-circle" style="width:280px;height:280px;bottom:-80px;left:-60px;opacity:0.04"></div>
      <div class="deco-circle" style="width:100px;height:100px;top:280px;left:120px;opacity:0.06"></div>
    </div>
    <div class="illus-content">
      <!-- 登录页插画：家庭理财场景 -->
      <svg class="illus-svg" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- 大圆背景 -->
        <circle cx="160" cy="140" r="130" fill="#fff" opacity="0.12"/>
        <circle cx="160" cy="140" r="100" fill="#fff" opacity="0.08"/>
        <!-- 存钱罐 -->
        <rect x="110" y="130" width="70" height="60" rx="14" fill="#fff" opacity="0.9"/>
        <rect x="130" y="118" width="30" height="16" rx="4" fill="#fff" opacity="0.7"/>
        <circle cx="155" cy="140" r="4" fill="var(--prD)" opacity="0.5"/>
        <!-- 金币 -->
        <circle cx="140" cy="165" r="10" fill="#FFD700" opacity="0.9"/><text x="136" y="169" font-size="10" fill="#B8860B" font-weight="700">¥</text>
        <circle cx="170" cy="175" r="10" fill="#FFD700" opacity="0.9"/><text x="166" y="179" font-size="10" fill="#B8860B" font-weight="700">¥</text>
        <circle cx="155" cy="185" r="10" fill="#FFD700" opacity="0.9"/><text x="151" y="189" font-size="10" fill="#B8860B" font-weight="700">¥</text>
        <circle cx="125" cy="178" r="8" fill="#FFD700" opacity="0.7"/><text x="121" y="182" font-size="8" fill="#B8860B" font-weight="700">¢</text>
        <!-- 账本 -->
        <rect x="200" y="120" width="50" height="65" rx="5" fill="#fff" opacity="0.85"/>
        <rect x="210" y="128" width="30" height="4" rx="2" fill="var(--prD)" opacity="0.4"/>
        <rect x="210" y="138" width="30" height="4" rx="2" fill="var(--prD)" opacity="0.4"/>
        <rect x="210" y="148" width="20" height="4" rx="2" fill="var(--prD)" opacity="0.4"/>
        <rect x="210" y="158" width="25" height="4" rx="2" fill="var(--prD)" opacity="0.3"/>
        <!-- 图表上升箭头 -->
        <polyline points="80,110 100,90 120,95 140,75" stroke="#fff" stroke-width="2.5" fill="none" opacity="0.7" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="80" y1="110" x2="80" y2="110" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      </svg>
      <h2>欢迎回来</h2>
      <p class="illus-sub">记录每一笔，看清每一分<br>让家庭的财务井井有条</p>
    </div>
    <div class="illus-footer">静记 · 让每一笔都清晰可见</div>
  </div>

  <!-- Right: Form -->
  <div class="auth-form">
    <div class="form-inner">
      <div class="form-logo"><div class="fl-icon">静</div><span class="fl-text">静记</span></div>
      <h3>登录账户</h3>
      <p class="form-desc">欢迎回来，请输入您的账户信息</p>
      <div class="form-group"><label>邮箱地址</label><input type="email" placeholder="your@email.com" id="loginEmail"></div>
      <div class="form-group"><label>密码</label><input type="password" placeholder="••••••••" id="loginPass"></div>
      <button class="btn-submit" onclick="authSubmit('login')">登 录</button>
      <div class="form-links">
        <a onclick="switchPage('forgot')">忘记密码？</a>
        <a onclick="switchPage('register')">注册新账户</a>
      </div>
    </div>
  </div>
</div>

<!-- ═══ REGISTER ═══ -->
<div class="auth-page" id="page-register">
  <!-- Left: Illustration -->
  <div class="auth-illus">
    <div class="illus-bg">
      <div class="deco-circle" style="width:360px;height:360px;bottom:-80px;right:-100px;opacity:0.06"></div>
      <div class="deco-circle" style="width:200px;height:200px;top:40px;left:-60px;opacity:0.04"></div>
    </div>
    <div class="illus-content">
      <!-- 注册页插画：开始记账 -->
      <svg class="illus-svg" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="160" cy="140" r="130" fill="#fff" opacity="0.12"/>
        <!-- 打开的书/账本 -->
        <path d="M100,120 Q160,100 220,120 L220,200 Q160,180 100,200 Z" fill="#fff" opacity="0.85"/>
        <path d="M100,120 L100,200 Q160,180 220,200" stroke="#fff" stroke-width="1" fill="none" opacity="0.4"/>
        <!-- 书页文字 -->
        <line x1="120" y1="140" x2="200" y2="138" stroke="var(--prD)" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
        <line x1="120" y1="152" x2="190" y2="150" stroke="var(--prD)" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
        <line x1="120" y1="164" x2="180" y2="162" stroke="var(--prD)" stroke-width="1.5" opacity="0.25" stroke-linecap="round"/>
        <!-- 笔 -->
        <line x1="225" y1="108" x2="240" y2="90" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
        <circle cx="243" cy="86" r="4" fill="#fff" opacity="0.9"/>
        <!-- + 号 -->
        <circle cx="180" cy="88" r="22" fill="#fff" opacity="0.15"/>
        <line x1="180" y1="78" x2="180" y2="98" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <line x1="170" y1="88" x2="190" y2="88" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <!-- 浮动金币 -->
        <circle cx="110" cy="85" r="9" fill="#FFD700" opacity="0.8"/>
        <circle cx="240" cy="140" r="7" fill="#FFD700" opacity="0.6"/>
        <!-- 图表条 -->
        <rect x="250" y="165" width="10" height="25" rx="2" fill="#fff" opacity="0.3"/>
        <rect x="265" y="150" width="10" height="40" rx="2" fill="#fff" opacity="0.45"/>
        <rect x="280" y="175" width="10" height="15" rx="2" fill="#fff" opacity="0.25"/>
      </svg>
      <h2>开始记账</h2>
      <p class="illus-sub">加入静记，开启智能记账之旅<br>让每一笔收支都一目了然</p>
    </div>
    <div class="illus-footer">静记 · 开启你的第一笔</div>
  </div>

  <!-- Right: Form -->
  <div class="auth-form">
    <div class="form-inner">
      <div class="form-logo"><div class="fl-icon">静</div><span class="fl-text">静记</span></div>
      <h3>创建账户</h3>
      <p class="form-desc">填写以下信息注册新账户</p>
      <div class="form-group"><label>用户名</label><input type="text" placeholder="您的昵称" id="regUser"></div>
      <div class="form-group"><label>邮箱地址</label><input type="email" placeholder="your@email.com" id="regEmail"></div>
      <div class="form-row">
        <div class="form-group"><label>密码</label><input type="password" placeholder="至少6位" id="regPass"></div>
        <div class="form-group"><label>确认密码</label><input type="password" placeholder="再次输入" id="regPass2"></div>
      </div>
      <button class="btn-submit" onclick="authSubmit('register')">注 册</button>
      <div class="form-links" style="justify-content:center">
        <a onclick="switchPage('login')">已有账户？立即登录</a>
      </div>
    </div>
  </div>
</div>

<!-- ═══ FORGOT PASSWORD ═══ -->
<div class="auth-page" id="page-forgot">
  <!-- Left: Illustration -->
  <div class="auth-illus">
    <div class="illus-bg">
      <div class="deco-circle" style="width:320px;height:320px;top:-60px;right:-80px;opacity:0.05"></div>
      <div class="deco-circle" style="width:180px;height:180px;bottom:40px;left:-40px;opacity:0.05"></div>
    </div>
    <div class="illus-content">
      <!-- 忘记密码插画：钥匙和锁 -->
      <svg class="illus-svg" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="160" cy="140" r="130" fill="#fff" opacity="0.12"/>
        <!-- 锁 -->
        <rect x="130" y="155" width="60" height="45" rx="8" fill="#fff" opacity="0.9"/>
        <path d="M140,155 L140,135 Q140,110 160,110 Q180,110 180,135 L180,155" stroke="#fff" stroke-width="4" fill="none" opacity="0.8" stroke-linecap="round"/>
        <circle cx="160" cy="175" r="6" fill="var(--prD)" opacity="0.5"/>
        <rect x="157" y="175" width="6" height="14" rx="3" fill="var(--prD)" opacity="0.5"/>
        <!-- 钥匙 -->
        <circle cx="230" cy="125" r="14" fill="none" stroke="#fff" stroke-width="3" opacity="0.8"/>
        <line x1="244" y1="125" x2="270" y2="125" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
        <line x1="260" y1="125" x2="260" y2="135" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
        <line x1="250" y1="125" x2="250" y2="132" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
        <!-- 邮件图标 -->
        <rect x="90" y="100" width="50" height="34" rx="6" fill="#fff" opacity="0.7"/>
        <path d="M90,100 L115,118 L140,100" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.5"/>
        <!-- 连接线 -->
        <line x1="140" y1="110" x2="175" y2="120" stroke="#fff" stroke-width="1" opacity="0.3" stroke-dasharray="4,4"/>
        <line x1="210" y1="120" x2="216" y2="122" stroke="#fff" stroke-width="1" opacity="0.3" stroke-dasharray="4,4"/>
      </svg>
      <h2>找回密码</h2>
      <p class="illus-sub">别担心，我们帮你找回<br>请验证您的身份信息</p>
    </div>
    <div class="illus-footer">静记 · 安全可靠</div>
  </div>

  <!-- Right: Form with 2-step flow -->
  <div class="auth-form">
    <div class="form-inner">
      <div class="form-logo"><div class="fl-icon">静</div><span class="fl-text">静记</span></div>
      <h3 id="fpTitle">忘记密码</h3>
      <p class="form-desc" id="fpDesc">请输入注册邮箱，我们将发送验证码</p>

      <!-- Step indicator -->
      <div class="step-indicator">
        <div class="step-dot active" id="stepDot1"></div>
        <div class="step-line" id="stepLine"></div>
        <div class="step-dot" id="stepDot2"></div>
      </div>

      <!-- Step 1: email -->
      <div id="fpStep1">
        <div class="form-group"><label>邮箱地址</label><input type="email" placeholder="注册时使用的邮箱" id="forgotEmail">
        <div class="field-error" id="fpErrEmail">请输入有效的邮箱地址</div></div>
        <button class="btn-submit" onclick="fpNextStep()">发送验证码</button>
      </div>

      <!-- Step 2: code + new password -->
      <div id="fpStep2" style="display:none">
        <div class="form-group">
          <label>邮箱地址</label>
          <input type="email" id="forgotEmailDisplay" disabled style="background:var(--bg);color:var(--fg3)">
        </div>
        <div class="form-group">
          <label>验证码</label>
          <div style="display:flex;gap:8px">
            <input type="text" placeholder="6位数字" maxlength="6" style="flex:1" id="forgotCode">
            <button class="btn-code" id="btnResend" onclick="fpResendCode()">重新发送</button>
          </div>
          <div class="field-error" id="fpErrCode">请输入验证码</div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>新密码</label><input type="password" placeholder="至少6位" id="forgotNewPass"><div class="field-error" id="fpErrPass">密码至少6位</div></div>
          <div class="form-group"><label>确认密码</label><input type="password" placeholder="再次输入" id="forgotNewPass2"><div class="field-error" id="fpErrPass2">两次密码不一致</div></div>
        </div>
        <button class="btn-submit" onclick="fpSubmit()">重置密码</button>
      </div>

      <!-- Success (hidden) -->
      <div id="fpSuccess" style="display:none">
        <div class="success-card">
          <div class="sc-icon">✅</div>
          <h4>密码重置成功</h4>
          <p>请使用新密码登录账户</p>
        </div>
        <button class="btn-submit" style="margin-top:16px" onclick="switchPage('login')">返回登录</button>
      </div>

      <div class="form-links" style="justify-content:center">
        <a onclick="switchPage('login')">← 返回登录</a>
      </div>
    </div>
  </div>
</div>

<script>
function switchPage(page){
  document.querySelectorAll('.page-tab').forEach(t=>t.classList.remove('active'));
  document.querySelector('.page-tab[onclick*="'+page+'"]').classList.add('active');
  document.querySelectorAll('.auth-page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  if(page==='forgot')resetForgotState();
}
function authSubmit(type){
  const btns=document.querySelectorAll('.btn-submit');
  let email,pass,user,pass2;
  if(type==='login'){email=document.getElementById('loginEmail').value;pass=document.getElementById('loginPass').value;if(!email||!pass)return alert('请填写邮箱和密码')}
  if(type==='register'){user=document.getElementById('regUser').value;email=document.getElementById('regEmail').value;pass=document.getElementById('regPass').value;pass2=document.getElementById('regPass2').value;if(!user||!email||!pass||!pass2)return alert('请填写所有字段');if(pass!==pass2)return alert('两次密码不一致');if(pass.length<6)return alert('密码至少6位')}
  const b=document.querySelector('.auth-page.active .btn-submit');b.disabled=true;b.textContent='处理中...';setTimeout(()=>{b.disabled=false;b.textContent=type==='register'?'注 册':'登 录';alert((type==='register'?'注册':'登录')+'请求已发送（Mock）')},800);
}
/* Forgot password 2-step flow */
function resetForgotState(){
  document.getElementById('fpStep1').style.display='block';document.getElementById('fpStep2').style.display='none';document.getElementById('fpSuccess').style.display='none';
  document.getElementById('fpTitle').textContent='忘记密码';document.getElementById('fpDesc').textContent='请输入注册邮箱，我们将发送验证码';
  document.getElementById('stepDot1').classList.add('active');document.getElementById('stepDot1').classList.remove('done');document.getElementById('stepDot2').classList.remove('active','done');document.getElementById('stepLine').classList.remove('done');
  document.querySelectorAll('#page-forgot .field-error').forEach(e=>e.classList.remove('show'));
}
function fpNextStep(){
  const v=document.getElementById('forgotEmail').value.trim();if(!v){document.getElementById('fpErrEmail').classList.add('show');return}document.getElementById('fpErrEmail').classList.remove('show');
  document.getElementById('forgotEmailDisplay').value=v;document.getElementById('fpStep1').style.display='none';document.getElementById('fpStep2').style.display='block';
  document.getElementById('fpTitle').textContent='重置密码';document.getElementById('fpDesc').textContent='验证码已发送至 '+v;
  document.getElementById('stepDot1').classList.replace('active','done');document.getElementById('stepDot2').classList.add('active');document.getElementById('stepLine').classList.add('done');
}
function fpSubmit(){
  const c=document.getElementById('forgotCode').value.trim();const p=document.getElementById('forgotNewPass').value.trim();const p2=document.getElementById('forgotNewPass2').value.trim();let ok=true;
  if(!c){document.getElementById('fpErrCode').classList.add('show');ok=false}else document.getElementById('fpErrCode').classList.remove('show');
  if(p.length<6){document.getElementById('fpErrPass').classList.add('show');ok=false}else document.getElementById('fpErrPass').classList.remove('show');
  if(p!==p2){document.getElementById('fpErrPass2').classList.add('show');ok=false}else document.getElementById('fpErrPass2').classList.remove('show');
  if(!ok)return;
  document.getElementById('fpStep2').style.display='none';document.getElementById('fpSuccess').style.display='block';document.getElementById('stepDot2').classList.replace('active','done');
}
function fpResendCode(){const b=document.getElementById('btnResend');b.disabled=true;b.textContent='60s';let t=59;const i=setInterval(()=>{if(t<=0){clearInterval(i);b.disabled=false;b.textContent='重新发送';return}b.textContent=t+'s';t--},1000)}
</script>
</body>
</html>
